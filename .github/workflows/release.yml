name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            targets: linux-x64
          - os: ubuntu-24.04-arm
            targets: linux-arm64
          - os: macos-latest
            targets: darwin-x64 darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Versions match the tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          manifest=$(sed -n 's/^version = "\(.*\)"$/\1/p' herdr-plugin.toml | head -n 1)
          echo "tag=$tag Cargo.toml=$crate herdr-plugin.toml=$manifest"
          test "$tag" = "$crate" && test "$tag" = "$manifest"
      - name: musl toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          echo "CC_x86_64_unknown_linux_musl=musl-gcc" >> "$GITHUB_ENV"
          echo "CC_aarch64_unknown_linux_musl=musl-gcc" >> "$GITHUB_ENV"
      - run: cargo test --locked
      - run: sh scripts/build-release.sh ${{ matrix.targets }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: dist/release/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
