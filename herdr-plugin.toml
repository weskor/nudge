id = "weskor.nudge"
name = "Nudge"
version = "0.4.0"
min_herdr_version = "0.9.0"
description = "Tell your AI desk (a webhook automation) when an agent finishes or is blocked; the desk replies with herdr agent prompt."
platforms = ["linux", "macos"]

# Downloads the prebuilt nudge binary for this platform into dist/ (or builds it with Bun).
[[build]]
command = ["sh", "scripts/install.sh"]

# Keeps ~/.local/bin/nudge pointing at the current install after updates.
[[startup]]
command = ["sh", "bin/nudge", "plugin", "startup"]

[[events]]
on = "pane.agent_status_changed"
command = ["sh", "bin/nudge", "plugin", "event"]

[[actions]]
id = "setup"
title = "Nudge: set up a desk"
command = ["sh", "bin/nudge", "plugin", "action", "setup"]

[[actions]]
id = "status"
title = "Nudge: status"
command = ["sh", "bin/nudge", "plugin", "action", "status"]

[[actions]]
id = "ask-desk"
title = "Nudge: send this pane to the desk"
command = ["sh", "bin/nudge", "plugin", "action", "ask-desk"]

[[actions]]
id = "toggle"
title = "Nudge: toggle auto-notify"
command = ["sh", "bin/nudge", "plugin", "action", "toggle"]

[[actions]]
id = "enable"
title = "Nudge: turn auto-notify on"
command = ["sh", "bin/nudge", "plugin", "action", "enable"]

[[actions]]
id = "disable"
title = "Nudge: turn auto-notify off"
command = ["sh", "bin/nudge", "plugin", "action", "disable"]

[[panes]]
id = "setup"
title = "Nudge setup"
placement = "overlay"
command = ["sh", "bin/nudge", "setup", "--pane"]

[[panes]]
id = "status"
title = "Nudge status"
placement = "overlay"
command = ["sh", "bin/nudge", "doctor", "--pane"]
