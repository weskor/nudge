<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" width="860" height="400" role="img" aria-labelledby="title desc">
  <title id="title">nudge setup in a terminal</title>
  <desc id="desc">Step 1 of 4 of the nudge setup wizard. The step list on the left shows Connect webhook as the current step, then Name, Options and Test and save still to come. The webhook URL came from the clipboard and is checked; the Authorization header was pasted and is shown only as a masked preview, also checked.</desc>
  <style>
    .mono { white-space: pre; font-family: "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace; font-size: 13px; }
    .t { fill: #e6edf3; } .d { fill: #8b949e; } .g { fill: #3fb950; } .r { fill: #f85149; } .c { fill: #39c5cf; } .k { fill: #0d1117; } .w { font-weight: 700; }
  </style>
  <rect x="0" y="0" width="860" height="400" rx="14" fill="#0d1117" stroke="#30363d"/>
  <rect x="0.5" y="0.5" width="859" height="36" rx="14" fill="#161b22"/>
  <rect x="0.5" y="22" width="859" height="15" fill="#161b22"/>
  <line x1="0" y1="37" x2="860" y2="37" stroke="#30363d"/>
  <circle cx="22" cy="18" r="6" fill="#f85149"/>
  <circle cx="42" cy="18" r="6" fill="#d29922"/>
  <circle cx="62" cy="18" r="6" fill="#3fb950"/>
  <text x="430" y="23" class="mono d" text-anchor="middle" font-size="12">herdr plugin action invoke weskor.nudge.setup</text>

  <rect x="28" y="58" width="804" height="322" rx="10" fill="none" stroke="#484f58"/>
  <rect x="42" y="50" width="172" height="16" fill="#0d1117"/>
  <text x="48" y="62" class="mono c w">Setup · Step 1 of 4</text>

  <line x1="216" y1="76" x2="216" y2="306" stroke="#30363d"/>
  <line x1="52" y1="320" x2="808" y2="320" stroke="#484f58"/>

  <text class="mono" xml:space="preserve">
    <tspan x="52" y="96" class="c w">▸ Connect webhook</tspan>
    <tspan x="52" y="117" class="d">○ Name</tspan>
    <tspan x="52" y="138" class="d">○ Options</tspan>
    <tspan x="52" y="159" class="d">○ Test and save</tspan>

    <tspan x="232" y="96" class="t">Where should nudge send agent events? Copy the URL and the</tspan>
    <tspan x="232" y="117" class="t">Authorization header from your webhook's settings: an AI routine,</tspan>
    <tspan x="232" y="138" class="t">a workflow automation or your own service.</tspan>
    <tspan x="232" y="180" class="t">Webhook URL    https://hooks.example.com/h/7f3c2a</tspan><tspan class="g">  ✓</tspan>
    <tspan x="232" y="201" class="d">               from the clipboard</tspan>
    <tspan x="232" y="243" class="t w">Authorization  Bearer ••••••••cdef  (34 characters)</tspan><tspan class="g">  ✓</tspan>
    <tspan x="232" y="264" class="d">               pasted</tspan>

    <tspan x="52" y="365" class="c w">enter</tspan><tspan class="d"> next  </tspan><tspan class="c w">tab</tspan><tspan class="d"> field  </tspan><tspan class="c w">esc</tspan><tspan class="d"> leave  </tspan><tspan class="c w">ctrl-c</tspan><tspan class="d"> quit</tspan>
  </text>
</svg>
