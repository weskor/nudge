<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 380" width="920" height="380" role="img" aria-labelledby="title desc">
  <title id="title">nudge: herdr agents tell your webhook when they are done or blocked</title>
  <desc id="desc">Three coding agents in herdr. When one finishes or gets blocked, nudge sends an event to your webhook. The AI routine behind it replies straight into the agent's pane with herdr agent prompt.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/>
    </marker>
    <style>
      .sans { font-family: -apple-system, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
      .mono { font-family: "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace; }
    </style>
  </defs>

  <rect x="0" y="0" width="920" height="380" rx="16" fill="#0d1117"/>

  <!-- herdr: agents -->
  <rect x="24" y="24" width="300" height="250" rx="12" fill="#161b22" stroke="#30363d"/>
  <text x="44" y="56" class="sans" font-size="14" font-weight="600" fill="#8b949e">herdr</text>
  <text x="304" y="56" class="sans" font-size="12" fill="#8b949e" text-anchor="end">3 agents</text>

  <rect x="40" y="72" width="268" height="52" rx="8" fill="#0d1117" stroke="#30363d"/>
  <circle cx="60" cy="98" r="6" fill="#3fb950"/>
  <text x="76" y="94" class="mono" font-size="14" fill="#e6edf3">api-refactor</text>
  <text x="76" y="113" class="sans" font-size="12" fill="#3fb950">done · 14 min turn</text>

  <rect x="40" y="134" width="268" height="52" rx="8" fill="#0d1117" stroke="#d29922"/>
  <circle cx="60" cy="160" r="6" fill="#d29922"/>
  <text x="76" y="156" class="mono" font-size="14" fill="#e6edf3">billing-fix</text>
  <text x="76" y="175" class="sans" font-size="12" fill="#d29922">blocked · waiting for approval</text>

  <rect x="40" y="196" width="268" height="52" rx="8" fill="#0d1117" stroke="#30363d"/>
  <circle cx="60" cy="222" r="6" fill="none" stroke="#58a6ff" stroke-width="2"/>
  <text x="76" y="218" class="mono" font-size="14" fill="#e6edf3">docs-sweep</text>
  <text x="76" y="237" class="sans" font-size="12" fill="#8b949e">working</text>

  <!-- event -->
  <path d="M 324 128 L 586 128" stroke="#58a6ff" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="455" y="114" class="sans" font-size="13" font-weight="600" fill="#58a6ff" text-anchor="middle">nudge → webhook</text>
  <rect x="338" y="142" width="240" height="104" rx="8" fill="#161b22" stroke="#30363d"/>
  <text class="mono" font-size="11" fill="#8b949e">
    <tspan x="350" y="162">{</tspan>
    <tspan x="360" y="179"><tspan fill="#79c0ff">"from_agent"</tspan>: <tspan fill="#a5d6ff">"billing-fix"</tspan>,</tspan>
    <tspan x="360" y="196"><tspan fill="#79c0ff">"repo"</tspan>: <tspan fill="#a5d6ff">"acme/billing"</tspan>,</tspan>
    <tspan x="360" y="213"><tspan fill="#79c0ff">"status"</tspan>: <tspan fill="#a5d6ff">"blocked"</tspan>,</tspan>
    <tspan x="360" y="230"><tspan fill="#79c0ff">"message"</tspan>: <tspan fill="#a5d6ff">"…"</tspan> }</tspan>
  </text>

  <!-- webhook -->
  <rect x="596" y="24" width="300" height="250" rx="12" fill="#161b22" stroke="#30363d"/>
  <text x="616" y="56" class="sans" font-size="14" font-weight="600" fill="#8b949e">your webhook</text>
  <text x="876" y="56" class="sans" font-size="12" fill="#8b949e" text-anchor="end">AI routine or automation</text>

  <rect x="612" y="72" width="268" height="78" rx="8" fill="#0d1117" stroke="#d29922"/>
  <text x="626" y="94" class="sans" font-size="13" font-weight="600" fill="#d29922">⚠ acme/billing (billing-fix)</text>
  <text x="626" y="114" class="sans" font-size="12.5" fill="#e6edf3">Wants to run migrations on staging.</text>
  <text x="626" y="134" class="sans" font-size="12.5" fill="#8b949e">Escalated to you: needs a credential.</text>

  <rect x="612" y="160" width="268" height="98" rx="8" fill="#0d1117" stroke="#30363d"/>
  <text x="626" y="182" class="sans" font-size="13" font-weight="600" fill="#3fb950">✓ acme/api (api-refactor)</text>
  <text x="626" y="202" class="sans" font-size="12.5" fill="#e6edf3">Tests pass, one TODO left in</text>
  <text x="626" y="220" class="sans" font-size="12.5" fill="#e6edf3">auth.ts. Replying to the agent.</text>
  <text x="626" y="243" class="mono" font-size="11" fill="#8b949e">herdr agent prompt api-refactor</text>

  <!-- reply -->
  <path d="M 746 274 L 746 318 L 174 318 L 174 280" stroke="#3fb950" stroke-width="2" fill="none" marker-end="url(#arrow-green)"/>
  <rect x="222" y="300" width="476" height="36" rx="8" fill="#0d1117" stroke="#3fb950"/>
  <text x="460" y="323" class="mono" font-size="12" fill="#e6edf3" text-anchor="middle">Coordinator: resolve the TODO in auth.ts, then open the PR</text>
  <text x="460" y="360" class="sans" font-size="12" fill="#8b949e" text-anchor="middle">The reply lands in the agent's pane as a new prompt. No polling, no copy-paste.</text>
</svg>
